<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1031 · 第一次約會紀念日</title>
<style>
:root{--cream:#FFF4E6;--peach:#FFD6B0;--coral:#FF6B57;--gold:#FFB84D;--deep:#5A2A27;--rose:#FF8FA3}
@media (prefers-color-scheme:dark){:root{--cream:#FFF4E6;--deep:#5A2A27}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--cream);color:var(--deep);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#FFE9C9 0%,#FFD0AE 55%,#FF9E8A 100%);z-index:-3}
.blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.55;z-index:-2;animation:drift 12s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;background:#FFE08A;top:-25vmax;left:-15vmax}
.b2{width:50vmax;height:50vmax;background:#FF8F7A;bottom:-20vmax;right:-15vmax;animation-delay:-5s}
.b3{width:35vmax;height:35vmax;background:#FFC1D0;top:35%;left:40%;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.rays{position:fixed;left:50%;top:-30vh;width:160vmax;height:160vmax;margin-left:-80vmax;z-index:-1;opacity:.35;
background:repeating-conic-gradient(from 0deg,#fff8 0 6deg,#fff0 6deg 18deg);animation:spin 60s linear infinite;
-webkit-mask:radial-gradient(circle,#000 0,#0000 60%);mask:radial-gradient(circle,#000 0,#0000 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
#dots{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:20}
#dots i{width:8px;height:8px;border-radius:8px;background:#fff9;transition:.5s}
#dots i.on{width:26px;background:var(--coral)}
.stage{position:fixed;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;
opacity:0;pointer-events:none;transform:scale(.92) translateY(30px);filter:blur(8px);transition:all .8s cubic-bezier(.2,.9,.3,1)}
.stage.on{opacity:1;pointer-events:auto;transform:none;filter:none}
h1,h2{margin:0;font-weight:800;letter-spacing:.06em}
h2{font-size:26px}
.sub{margin:10px 0 0;font-size:15px;opacity:.75;letter-spacing:.1em}
.btn{margin-top:28px;border:0;background:var(--coral);color:#fff;font:700 18px inherit;font-family:inherit;padding:15px 38px;border-radius:40px;box-shadow:0 10px 0 #D94A3A,0 18px 30px #ff6b5766;
animation:bob 1.6s ease-in-out infinite;cursor:pointer;transition:transform .15s}
.btn:active{transform:translateY(6px);box-shadow:0 4px 0 #D94A3A}
.btn.hide{display:none}
@keyframes bob{50%{transform:translateY(-6px)}}
/* stage1 */
#num{font-size:min(38vw,170px);font-weight:900;line-height:1;color:var(--coral);text-shadow:0 8px 0 #fff9,0 0 50px #FFB84D;font-variant-numeric:tabular-nums;transition:transform .3s}
#num.done{animation:pop 1s ease both}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1)}}
#s1 #num{color:#fff;text-shadow:0 6px 0 #c0392b66,0 0 40px #FFB84D}#s1 .sub{color:#fff}#s1 .btn{background:#fff;color:var(--coral);box-shadow:0 10px 0 #f0b9a8,0 18px 30px #0003}
#door{position:fixed;inset:0;z-index:1;display:flex;pointer-events:none;perspective:900px}
#door div{flex:1;background:linear-gradient(90deg,#E8553F,#FF7A62);position:relative;transition:transform 1.4s cubic-bezier(.7,0,.2,1);box-shadow:inset 0 0 60px #0003;
background-image:repeating-linear-gradient(90deg,#0000 0 38px,#0001 38px 40px),linear-gradient(#FF7A62,#E8553F)}
#door .l{transform-origin:left;border-right:3px solid #8a2c1d}
#door .r{transform-origin:right}
#door .l::after,#door .r::after{content:"";position:absolute;top:50%;width:16px;height:70px;border-radius:10px;background:var(--gold);box-shadow:0 0 14px #fff}
#door .l::after{right:14px}#door .r::after{left:14px}
#door.open .l{transform:rotateY(-105deg)}#door.open .r{transform:rotateY(105deg)}
#door.gone{opacity:0;transition:opacity .8s}
#glow{position:fixed;inset:0;background:radial-gradient(circle,#fff 0,#FFE9A8 40%,#0000 75%);opacity:0;z-index:14;pointer-events:none;transition:opacity 1s}
/* stage2 */
#heartWrap{position:relative;width:min(70vw,290px);aspect-ratio:1;touch-action:none;cursor:pointer;margin:20px 0 10px}
#heartWrap svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 22px #ff6b5766);transition:transform .1s}
#pct{font-size:44px;font-weight:900;color:var(--coral)}
.ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--coral);opacity:0;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:.7}to{transform:scale(1.5);opacity:0}}
#heartWrap.boom svg{animation:boom .7s ease-out forwards}
@keyframes boom{50%{transform:scale(1.4)}100%{transform:scale(3);opacity:0}}
/* stage3 */
#scratch{position:relative;width:min(80vw,330px);aspect-ratio:4/5;border-radius:22px;overflow:hidden;box-shadow:0 20px 40px #5a2a2733,0 0 0 8px #fff;margin-top:20px;transform:rotate(-2deg)}
#under{position:absolute;inset:0;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:10px 10px 52px}
#under img{width:100%;height:100%;object-fit:cover;border-radius:10px}
#under b{position:absolute;bottom:10px;left:0;right:0;font-size:18px;letter-spacing:.2em;color:var(--coral)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity 1s}
/* stage4 */
#deck{position:relative;width:min(72vw,290px);aspect-ratio:3/4.2;margin:26px 0 0;perspective:1000px}
.card{position:absolute;inset:0;transform-style:preserve-3d;touch-action:none;cursor:grab;transition:transform .6s cubic-bezier(.2,.9,.3,1.2),opacity .5s}
.card.drag{transition:none;cursor:grabbing}
.card .f,.card .k{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 34px #5a2a2740}
.card .f{background:#fff;padding:10px 10px 46px}
.card .f img{width:100%;height:100%;object-fit:cover;border-radius:12px;pointer-events:none}
.card .f span{position:absolute;bottom:12px;left:0;right:0;font-size:14px;letter-spacing:.2em;opacity:.7}
.card .k{transform:rotateY(180deg);background:linear-gradient(150deg,#FF8A73,#FF6B57 60%,#FFB84D);color:#fff;display:flex;align-items:center;justify-content:center;padding:28px;font-size:21px;font-weight:700;line-height:1.7;letter-spacing:.08em}
.card.flip{transform:rotateY(180deg) rotate(3deg) scale(1.04)}
.card.out{transform:translateX(130vw) rotate(25deg)!important;opacity:0}
#hint{margin-top:26px;font-size:15px;opacity:.75;letter-spacing:.1em;animation:bob 1.6s infinite}
/* stage5 */
#hearts{position:relative;width:min(92vw,420px);height:min(60vh,360px)}
.h{position:absolute;width:20px;height:20px;margin:-10px;pointer-events:none;will-change:transform}
.h svg{width:100%;height:100%;display:block;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.25)}}
#fin{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);opacity:0;transition:opacity 1.2s;font-size:20px;font-weight:700;letter-spacing:.14em;line-height:1.8}
#fin small{display:block;font-size:14px;opacity:.7;font-weight:400}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
</style></head><body>

const stages=$$('.stage'),dots=$$('#dots i');let cur=0;

function go(i){stages[cur].classList.remove('on');cur=i;stages[i].classList.add('on');dots.forEach((d,k)=>d.classList.toggle('on',k==i));
 ({1:()=>{},2:initScratch,3:initCards,4:initHearts})[i]?.()}
dots[0].classList.add('on');

const fx=$('#fx'),cx=fx.getContext('2d');let P=[],raf=0;
function fit(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}fit();addEventListener('resize',fit);
const COL=['#FF6B57','#FFB84D','#FF8FA3','#FFE08A','#fff'];
function burst(x,y,n=90,pow=1){const d=devicePixelRatio;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(4+Math.random()*10)*pow*d;
 P.push({x:x*d,y:y*d,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4*d,r:(8+Math.random()*14)*d,c:COL[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*.3,h:Math.random()<.6,l:1})}
 if(!raf)loop()}
function heart(c,x,y,s,r){c.save();c.translate(x,y);c.rotate(r);c.scale(s/20,s/20);c.beginPath();c.moveTo(0,8);c.bezierCurveTo(-14,-2,-8,-12,0,-5);c.bezierCurveTo(8,-12,14,-2,0,8);c.fill();c.restore()}
function loop(){cx.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l>0);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.25*devicePixelRatio;p.vx*=.985;p.rot+=p.vr;p.l-=.008;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;
  p.h?heart(cx,p.x,p.y,p.r,p.rot):cx.fillRect(p.x,p.y,p.r*.6,p.r*.6)}
 raf=P.length?requestAnimationFrame(loop):0}
addEventListener('pointerdown',e=>{if(cur!=1&&cur!=2&&cur!=3&&cur!=4)burst(e.clientX,e.clientY,8,.4)});
// ---- stage 1 ----
(function(){const n=$('#num');let t0=null;const D=3800;
 function step(t){t0??=t;const p=Math.min((t-t0)/D,1),e=1-Math.pow(1-p,3);n.textContent=Math.round(e*100);n.style.transform=`scale(${1+Math.sin(p*40)*.03*(1-p)})`;
  if(p<1)requestAnimationFrame(step);else{n.classList.add('done');$('#s1t').textContent='滿分的我們，準備好了嗎？';$('#openBtn').classList.remove('hide');burst(innerWidth/2,innerHeight/2,70);vib(40)}}
 setTimeout(()=>requestAnimationFrame(step),700);
 $('#openBtn').onclick=()=>{vib(30);stages[0].classList.remove('on');$('#door').classList.add('open');$('#glow').style.opacity=1;
  setTimeout(()=>{go(1);$('#door').classList.add('gone');$('#glow').style.opacity=0;burst(innerWidth/2,innerHeight/2,60)},1300)}})();

(function(){const w=$('#heartWrap'),liq=$('#liq'),pc=$('#pct');let p=0,hold=false,done=false,last=0;
 const dn=e=>{if(done)return;hold=true;e.preventDefault();w.insertAdjacentHTML('beforeend','<i class="ring"></i>')};
 const up=()=>{hold=false;w.querySelectorAll('.ring').forEach(r=>r.remove())};
 w.addEventListener('pointerdown',dn);addEventListener('pointerup',up);addEventListener('pointercancel',up);
 function tick(t){const dt=Math.min(t-last,50);last=t;
  if(!done){p=Math.max(0,Math.min(1,p+(hold?dt/2600:-dt/5000)));
   liq.style.transform=`translateY(${100-p*108}px)`;pc.textContent=Math.floor(p*100)+'%';
   const s=1+(hold?Math.sin(t/(90-p*50))*.04*(1+p*2):0)+p*.08;w.firstElementChild.style.transform=`scale(${s}) rotate(${hold?Math.sin(t/40)*p*2:0}deg)`;
   if(hold&&p>.3&&Math.random()<.2)vib(8);
   if(p>=1){done=true;up();pc.textContent='100%';w.classList.add('boom');vib([60,40,100]);const r=w.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,160,1.3);setTimeout(()=>burst(r.left+r.width/2,r.top+r.height/2,100,1),300);setTimeout(()=>go(2),1700)}}
  requestAnimationFrame(tick)}requestAnimationFrame(tick)})();

 const g=c.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#FFB84D');g.addColorStop(.5,'#FF8A73');g.addColorStop(1,'#FF6B57');c.fillStyle=g;c.fillRect(0,0,r.width,r.height);
 c.fillStyle='#fff6';c.font='bold 26px sans-serif';c.textAlign='center';for(let y=40;y<r.height;y+=64)for(let x=(y/64%2)*40;x<r.width+40;x+=80)c.fillText('♥',x,y);
 c.fillStyle='#fff';c.font='800 28px sans-serif';c.fillText('刮 開 我',r.width/2,r.height/2);
